<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101514">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DiscFinder">
    <title>DiscFinder Web</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <section class="scanner" aria-label="Camera scanner">
        <video id="camera" playsinline muted></video>
        <canvas id="analysisCanvas" aria-label="Processed camera view"></canvas>
        <div id="screenFlash" class="screen-flash" aria-hidden="true"></div>
        <div id="targetBox" class="target-box" aria-hidden="true"></div>
        <div class="reticle" aria-hidden="true"></div>

        <div class="status-bar">
          <div class="status-left">
            <span id="signalDot" class="signal-dot"></span>
            <span id="statusText">Ready</span>
          </div>
          <span id="confidenceText">0%</span>
        </div>

        <div class="zoom-controls scanner-zoom" aria-label="Camera zoom while controls are hidden">
          <button id="scanZoomOutButton" class="icon-button" type="button" aria-label="Zoom out">−</button>
          <span id="scanZoomValue" class="zoom-value">1.0×</span>
          <button id="scanZoomInButton" class="icon-button" type="button" aria-label="Zoom in">+</button>
        </div>

        <div class="scan-hud" aria-live="polite">
          <div class="scan-hud-top">
            <span id="hudColorSwatch" class="hud-swatch"></span>
            <span id="hudTargetText">Target color</span>
            <strong id="hudConfidenceText">0%</strong>
          </div>
          <div class="hud-meter" aria-hidden="true">
            <span id="hudMeterFill"></span>
          </div>
          <span id="hudDetailText">Scanning for selected color</span>
        </div>

        <div id="profileCapture" class="profile-capture" hidden>
          <div class="profile-status" aria-live="polite">
            <strong id="profileStatusText">Fill circle with disc</strong>
            <span id="profileStatusDetail">Auto capture waits for a steady profile</span>
          </div>
          <div class="profile-guide" aria-hidden="true">
            <div class="profile-circle"></div>
          </div>
          <div class="profile-capture-actions">
            <label class="toggle profile-auto-toggle">
              <input id="autoProfileToggle" type="checkbox" checked>
              <span>Auto</span>
            </label>
            <button id="cancelProfileButton" class="secondary-button" type="button">Cancel</button>
            <button id="snapProfileButton" class="primary-button" type="button">Capture</button>
          </div>
        </div>
      </section>

      <form class="control-panel" autocomplete="off">
        <button id="menuToggle" class="drawer-toggle" type="button" aria-expanded="true">
          <span id="menuToggleIcon" aria-hidden="true">⌄</span>
          <span id="menuToggleText">Hide controls</span>
        </button>

        <div class="top-controls">
          <button id="startButton" class="primary-button" type="button">
            <span class="button-icon">▶</span>
            <span>Start Camera</span>
          </button>

          <div class="zoom-controls" aria-label="Camera zoom">
            <button id="zoomOutButton" class="icon-button" type="button" aria-label="Zoom out">−</button>
            <span id="zoomValue" class="zoom-value">1.0×</span>
            <button id="zoomInButton" class="icon-button" type="button" aria-label="Zoom in">+</button>
          </div>

          <label class="color-pick">
            <span class="sr-only">Target disc color</span>
            <input id="colorPicker" type="color" value="#ff1f92">
          </label>
        </div>

        <div class="sample-row">
          <button id="sampleButton" class="secondary-button" type="button">
            <span class="button-icon">◎</span>
            <span>Sample Center</span>
          </button>

          <div class="sample-readout" aria-live="polite">
            <span id="sampleSwatch" class="sample-swatch"></span>
            <span id="sampleText">Aim reticle at disc</span>
          </div>
        </div>

        <section class="disc-library" aria-labelledby="libraryTitle">
          <div class="library-header">
            <div>
              <strong id="libraryTitle">My Bag</strong>
              <span id="libraryCount">No saved discs</span>
            </div>
            <button id="saveDiscButton" class="secondary-button compact-button" type="button">Save Color</button>
          </div>

          <label class="disc-name-field">
            <span class="sr-only">Disc name</span>
            <input id="discNameInput" type="text" maxlength="32" placeholder="Name this disc">
          </label>

          <div class="profile-row">
            <button id="profileCaptureButton" class="secondary-button compact-button" type="button">Disc Photo</button>
            <span id="profileSummary">Capture a circular disc profile</span>
          </div>

          <div id="discEditPanel" class="disc-edit-panel" hidden>
            <div class="edit-heading">
              <strong id="editDiscTitle">Editing disc</strong>
              <button id="cancelEditButton" class="disc-action" type="button">Done</button>
            </div>
            <div id="editColorList" class="edit-color-list" aria-label="Saved colors for selected disc"></div>
            <div class="edit-actions">
              <button id="addColorButton" class="disc-action" type="button">Add Current</button>
              <button id="replaceColorButton" class="disc-action" type="button">Replace Selected</button>
              <button id="removeColorButton" class="disc-action delete" type="button">Remove Selected</button>
            </div>
          </div>

          <div id="discList" class="disc-list" aria-live="polite"></div>
        </section>

        <div class="wheel-wrap">
          <canvas id="colorWheel" width="220" height="220" aria-label="Full color wheel"></canvas>
          <div class="wheel-copy">
            <strong>Color wheel</strong>
            <span id="rangeHint">Searching 312° to 348°</span>
          </div>
        </div>

        <div class="preset-row" aria-label="Color presets">
          <button class="preset active" type="button" data-color="#ff1f92" aria-label="Pink"></button>
          <button class="preset" type="button" data-color="#ff7a00" aria-label="Orange"></button>
          <button class="preset" type="button" data-color="#ffe600" aria-label="Yellow"></button>
          <button class="preset" type="button" data-color="#0078ff" aria-label="Blue"></button>
          <button class="preset" type="button" data-color="#9c3bff" aria-label="Purple"></button>
          <button class="preset" type="button" data-color="#ff2525" aria-label="Red"></button>
          <button class="preset" type="button" data-color="#f4f4f4" aria-label="White"></button>
          <button class="preset" type="button" data-color="#888888" aria-label="Grey"></button>
        </div>

        <div class="sliders">
          <label class="slider-row">
            <span>Range</span>
            <input id="rangeSlider" type="range" min="5" max="70" value="18">
            <output id="rangeValue">18°</output>
          </label>

          <label class="slider-row">
            <span>Sat</span>
            <input id="satSlider" type="range" min="5" max="95" value="42">
            <output id="satValue">42%</output>
          </label>

          <label class="slider-row">
            <span>Light</span>
            <input id="lightSlider" type="range" min="5" max="95" value="28">
            <output id="lightValue">28%</output>
          </label>

          <label class="slider-row">
            <span>Trigger</span>
            <input id="triggerSlider" type="range" min="1" max="80" value="6">
            <output id="triggerValue">0.6%</output>
          </label>
        </div>

        <div class="view-row" role="radiogroup" aria-label="Camera view mode">
          <span>View</span>
          <label><input type="radio" name="viewMode" value="grey" checked> Grey</label>
          <label><input type="radio" name="viewMode" value="boost"> Boost</label>
          <label><input type="radio" name="viewMode" value="mask"> Mask</label>
          <label><input type="radio" name="viewMode" value="outline"> Edge</label>
          <label><input type="radio" name="viewMode" value="color"> Color</label>
        </div>

        <div class="audio-row">
          <label class="toggle">
            <input id="aiToggle" type="checkbox" checked>
            <span>AI assist</span>
          </label>

          <label class="toggle">
            <input id="blobFilterToggle" type="checkbox" checked>
            <span>Blob filter</span>
          </label>

          <label class="toggle">
            <input id="foliageToggle" type="checkbox" checked>
            <span>Suppress green</span>
          </label>

          <label class="toggle">
            <input id="audioToggle" type="checkbox" checked>
            <span>Audio alert</span>
          </label>

          <label class="toggle">
            <input id="flashToggle" type="checkbox" checked>
            <span>Flash</span>
          </label>
        </div>

        <span id="aiStatus" class="ai-status" aria-live="polite">AI loads after camera starts</span>
      </form>
    </main>

    <script src="ai-assist.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
